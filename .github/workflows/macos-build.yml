name: Build macOS App

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # pubspec.yaml requires a beta Dart SDK (^3.13.0-...), so the stable
      # channel cannot resolve dependencies. The version is pinned to the one the
      # project was created with (Dart 3.13.0-282.3.beta): newer betas such as 3.50
      # make 15 widget tests fail with "An animation is still running even after
      # the widget tree was disposed". Raise it deliberately, after running the tests.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: beta
          flutter-version: 3.47.0-0.3.pre
          cache: true

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Check Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Build macOS release
        run: flutter build macos --release

      - name: Zip macOS app
        run: |
          cd build/macos/Build/Products/Release
          zip -r MW75-Bench-macOS-Release.zip "MW75 Bench.app"

      - name: Upload macOS app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MW75-Bench-macOS-Release
          path: build/macos/Build/Products/Release/MW75-Bench-macOS-Release.zip
